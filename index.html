<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>儿童英语词汇卡</title><style>body{max-width:580px;margin:auto;padding:16px;background:#fffdf7;color:#244750;font:18px system-ui}input,select,button{font:inherit;padding:7px;max-width:100%}img{display:block;width:100%;margin-top:12px}</style><h1>儿童英语词汇卡</h1><input id="q" placeholder="搜索英文或中文"><p><select id="s" aria-label="选择单词"></select></p><button id="prev">上一张</button> <button id="next">下一张</button> <span id="count"></span><img id="card"><script src="words.js"></script><script>let list;function show(){let w=list[s.selectedIndex];card.hidden=!w;if(w){card.src='cards/'+words.indexOf(w)+'.jpg';card.alt=w[0]}count.textContent=list.length?(s.selectedIndex+1)+' / '+list.length:'没有匹配词'}function filter(){list=words.filter(w=>w.join(' ').toLowerCase().includes(q.value.trim().toLowerCase()));s.replaceChildren(...list.map(w=>new Option(w[0])));show()}q.oninput=filter;s.onchange=show;function move(n){if(list.length){s.selectedIndex=(s.selectedIndex+n+list.length)%list.length;show()}}prev.onclick=()=>move(-1);next.onclick=()=>move(1);filter()</script></html>
